name: Build and Publish

on:
  workflow_dispatch: # enable manual trigger of workflow
  push:
    branches: [ "develop", "main", "patch/*", "rc/*"]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD        
    - name: Install gpg secret key
      if: github.actor != 'dependabot[bot]'
      run: |
        cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
        gpg --list-secret-keys --keyid-format LONG
    - name: Show repo structure
      run: |
        echo "📂 Current working directory: $PWD"
        echo "🔍 Listing contents:"
        tree -L 2 || ls -R        
    - name: Build and Publish with Maven
      run: |
        GPG_SKIP=$([[ "${{ github.actor }}" == "dependabot[bot]" ]] && echo "true" || echo "false")
        mvn -B -Dgpg.skip=$GPG_SKIP -Dgpg.passphrase=${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}  deploy --file pom.xml
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}